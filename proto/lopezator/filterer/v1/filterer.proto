syntax = "proto3";

package lopezator.filterer.v1;

// The filterer service definition.
service FiltererService {
  // Filter does the filterer magic!
  rpc Filter(FilterRequest) returns (FilterResponse) {}
}

// The request message containing the table and the filter string.
message FilterRequest {
  // The base query you want to use for your filtering operation.
  string base_query = 1;
  // The filter expression.
  string expr = 2;
}

// The response message containing the sql to issue the filtering, based on the base query and the filter request.
message FilterResponse {
  string query = 1;
}